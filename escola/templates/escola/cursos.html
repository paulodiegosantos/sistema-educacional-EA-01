{% extends 'escola/base.html' %}

{% block content %}

    <h2>Cursos cadastrados</h2>

    {% for curso in cursos %}
        <section>
            <h2>{{ curso.titulo }}</h2>
            <p>Descrição: {{ curso.descricao }}</p>
        </section>
    {% empty %}
        <p>Nenhum curso cadastrado.</p>
    {% endfor %}

{% endblock %}
