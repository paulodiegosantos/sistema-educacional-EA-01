<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos cadastrados</title>
</head>
<body>

    <h1>Cursos cadastrados</h1>

    {% for curso in cursos %}
        <section>
            <h2>{{ curso.titulo }}</h2>
            <p>Descrição: {{ curso.descricao }}</p>
        </section>
    {% empty %}
        <p>Nenhum curso cadastrado.</p>
    {% endfor %}

</body>
</html>
